<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F3F46"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 700; fill: #18181B; text-anchor: middle; }
      .s  { font-size: 12px; fill: #3F3F46; text-anchor: middle; }
      .h  { font-size: 16px; font-weight: 700; fill: #18181B; text-anchor: middle; }
      .lab { font-size: 11.5px; fill: #52525B; font-style: italic; }
      .note { font-size: 12px; fill: #52525B; text-anchor: middle; }
      .ret { fill: #E8F1FB; stroke: #2B6CB0; stroke-width: 1.6; }
      .llm { fill: #FDF1E3; stroke: #C05621; stroke-width: 1.6; }
      .det { fill: #F4F4F5; stroke: #71717A; stroke-width: 1.4; }
      .lane { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1.4; }
      .band { fill: #F8FAFC; stroke: #A1A1AA; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .a { stroke: #3F3F46; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="920" fill="#FFFFFF"/>

  <!-- Shared components -->
  <rect class="band" x="20" y="16" width="1240" height="118" rx="12"/>
  <text x="40" y="38" font-size="12px" font-weight="700" fill="#52525B" letter-spacing="1">SHARED ACROSS ALL THREE SYSTEMS</text>

  <rect class="det" x="40" y="52" width="250" height="66" rx="8"/>
  <text class="t" x="165" y="80">Input: SciFact claim</text>
  <text class="s" x="165" y="99">same claims for every system</text>

  <rect class="ret" x="330" y="52" width="430" height="66" rx="8"/>
  <text class="t" x="545" y="80">Retriever: BGE-small-en-v1.5 → FAISS (exact IP)</text>
  <text class="s" x="545" y="99">5,183 SciFact abstracts · title + full abstract per document</text>

  <rect class="llm" x="800" y="52" width="440" height="66" rx="8"/>
  <text class="t" x="1020" y="80">Generator: Qwen3-4B-Instruct-2507</text>
  <text class="s" x="1020" y="99">served locally through Ollama · structured JSON output</text>

  <!-- Lanes -->
  <rect class="lane" x="20"  y="160" width="340" height="600" rx="12"/>
  <rect class="lane" x="380" y="160" width="450" height="600" rx="12"/>
  <rect class="lane" x="850" y="160" width="410" height="600" rx="12"/>
  <text class="h" x="190"  y="190">A · Standard RAG</text>
  <text class="h" x="605"  y="190">B · Iterative RAG</text>
  <text class="h" x="1055" y="190">C · ARGUS</text>

  <!-- A: Standard RAG -->
  <rect class="det" x="65" y="215" width="250" height="52" rx="8"/>
  <text class="t" x="190" y="238">Claim used as query</text>
  <text class="s" x="190" y="256">no rewriting</text>

  <rect class="ret" x="65" y="305" width="250" height="56" rx="8"/>
  <text class="t" x="190" y="329">Dense retrieval</text>
  <text class="s" x="190" y="348">single pass · top-5 abstracts</text>

  <rect class="llm" x="65" y="400" width="250" height="70" rx="8"/>
  <text class="t" x="190" y="425">Verdict generation</text>
  <text class="s" x="190" y="444">one LLM call over the 5 abstracts</text>
  <text class="s" x="190" y="461">cites doc IDs + sentence indices</text>

  <path class="a" d="M190,267 V303"/>
  <path class="a" d="M190,361 V398"/>
  <path class="a" d="M190,760 V788"/>

  <text class="note" x="190" y="718">1 retrieval · 1 LLM call</text>
  <text class="note" x="190" y="736">no evidence assessment</text>

  <!-- B: Iterative RAG -->
  <rect class="ret" x="405" y="215" width="240" height="60" rx="8"/>
  <text class="t" x="525" y="240">Retrieve · top-5</text>
  <text class="s" x="525" y="259">round 1 query = claim</text>

  <rect class="llm" x="405" y="335" width="240" height="64" rx="8"/>
  <text class="t" x="525" y="360">Assess sufficiency</text>
  <text class="s" x="525" y="379">LLM: is the evidence enough?</text>

  <rect class="llm" x="680" y="262" width="130" height="64" rx="8"/>
  <text class="t" x="745" y="288">Rewrite query</text>
  <text class="s" x="745" y="307">LLM targets the gap</text>

  <rect class="llm" x="405" y="470" width="240" height="70" rx="8"/>
  <text class="t" x="525" y="495">Verdict generation</text>
  <text class="s" x="525" y="514">over all accumulated evidence</text>
  <text class="s" x="525" y="531">cites doc IDs + sentence indices</text>

  <path class="a" d="M525,275 V333"/>
  <!-- insufficient: assess -> rewrite -->
  <path class="a" d="M645,367 H745 V328"/>
  <text class="lab" x="655" y="390">insufficient &amp;</text>
  <text class="lab" x="655" y="404">budget remaining</text>
  <!-- rewrite -> retrieve (loop) -->
  <path class="a" d="M745,262 V245 H647"/>
  <text class="lab" x="662" y="237">next round</text>
  <!-- sufficient -> verdict -->
  <path class="a" d="M525,399 V468"/>
  <text class="lab" x="535" y="428">sufficient, or</text>
  <text class="lab" x="535" y="442">budget exhausted</text>
  <path class="a" d="M605,760 V788"/>

  <rect class="det" x="405" y="600" width="400" height="62" rx="8"/>
  <text class="t" x="605" y="624">Budgets</text>
  <text class="s" x="605" y="644">≤3 retrieval rounds · ≤15 documents · ≤6 LLM calls</text>
  <text class="note" x="605" y="718">LangGraph loop · 1–3 retrievals · 2–6 LLM calls</text>
  <text class="note" x="605" y="736">stop reason logged per claim</text>

  <!-- C: ARGUS -->
  <rect class="det" x="930" y="212" width="250" height="50" rx="8"/>
  <text class="t" x="1055" y="234">Claim objective</text>
  <text class="s" x="1055" y="252">deterministic, no LLM call</text>

  <rect class="ret" x="870" y="300" width="180" height="78" rx="8"/>
  <text class="t" x="960" y="323">Support agent</text>
  <text class="s" x="960" y="342">query = claim</text>
  <text class="s" x="960" y="359">dense · top-5</text>

  <rect class="ret" x="1065" y="300" width="180" height="78" rx="8"/>
  <text class="t" x="1155" y="323">Challenge agent</text>
  <text class="s" x="1155" y="342">claim + counter-evidence</text>
  <text class="s" x="1155" y="359">terms · dense · top-5</text>

  <rect class="det" x="905" y="412" width="300" height="56" rx="8"/>
  <text class="t" x="1055" y="436">Merge &amp; deduplicate by doc ID</text>
  <text class="s" x="1055" y="455">≤10 documents · keeps which agent found each</text>

  <rect class="llm" x="905" y="502" width="300" height="70" rx="8"/>
  <text class="t" x="1055" y="527">Evidence Verifier</text>
  <text class="s" x="1055" y="546">one LLM call per claim–abstract pair</text>
  <text class="s" x="1055" y="563">SUPPORT / CONTRADICT / INSUFFICIENT</text>

  <rect class="llm" x="905" y="606" width="300" height="70" rx="8"/>
  <text class="t" x="1055" y="631">Judge</text>
  <text class="s" x="1055" y="650">final verdict from verified evidence only</text>
  <text class="s" x="1055" y="667">cites doc IDs + sentence indices</text>

  <path class="a" d="M1000,262 V280 H960 V298"/>
  <path class="a" d="M1110,262 V280 H1155 V298"/>
  <path class="a" d="M960,378 V396 H1000 V410"/>
  <path class="a" d="M1155,378 V396 H1110 V410"/>
  <path class="a" d="M1055,468 V500"/>
  <path class="a" d="M1055,572 V604"/>
  <path class="a" d="M1055,760 V788"/>

  <text class="note" x="1055" y="718">2 retrievals · ≤12 LLM calls</text>
  <text class="note" x="1055" y="736">(≤10 Verifier calls + 1 Judge call)</text>

  <!-- Output -->
  <rect class="det" x="20" y="790" width="1240" height="56" rx="10"/>
  <text class="t" x="640" y="814">Output: SUPPORT · CONTRADICT · INSUFFICIENT, with cited evidence</text>
  <text class="s" x="640" y="833">all systems scored with the same metrics against SciFact gold labels and rationales</text>

  <!-- Legend -->
  <rect class="ret" x="330" y="872" width="22" height="16" rx="3"/>
  <text x="360" y="885" font-size="12.5px" fill="#3F3F46">retrieval (shared retriever)</text>
  <rect class="llm" x="560" y="872" width="22" height="16" rx="3"/>
  <text x="590" y="885" font-size="12.5px" fill="#3F3F46">LLM call (shared generator)</text>
  <rect class="det" x="790" y="872" width="22" height="16" rx="3"/>
  <text x="820" y="885" font-size="12.5px" fill="#3F3F46">deterministic step</text>
</svg>
